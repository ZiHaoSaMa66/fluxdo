name: Build Android Debug APK

on:
  push:
    tags:
      - 'v*'

env:
  ANDROID_NDK_VERSION: '27.3.13750724'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            rust-target: aarch64-linux-android
            flutter-target: android-arm64
          - arch: armeabi-v7a
            rust-target: armv7-linux-androideabi
            flutter-target: android-arm
          - arch: x86_64
            rust-target: x86_64-linux-android
            flutter-target: android-x64

    steps:
      - name: Free disk space
        run: |
          echo "清理前:" && df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android/sdk/ndk \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/share/chromium
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "清理后:" && df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/doh_proxy
          key: android-${{ matrix.arch }}

      - name: Setup Android build environment
        run: |
          rustup target add ${{ matrix.rust-target }}
          cargo install cargo-ndk
          sudo apt-get update && sudo apt-get install -y cmake

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;${{ env.ANDROID_NDK_VERSION }}'

      - name: Configure Android NDK path
        run: |
          ndk_path="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          test -d "${ndk_path}"
          echo "ANDROID_NDK_HOME=${ndk_path}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_path}" >> "${GITHUB_ENV}"

      - name: Build Android Debug APK
        run: |
          dart tool/flutterw.dart build apk --debug --target-platform ${{ matrix.flutter-target }} --dart-define=cronetHttpNoPlay=true
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-debug.apk dist/fluxdo-${{ matrix.arch }}-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxdo-${{ matrix.arch }}-debug
          path: ./dist
          overwrite: true
